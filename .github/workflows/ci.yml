name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Validate BA package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -euo pipefail
          for f in \
            README.md \
            BA-METHOD.md \
            00-introduction.md \
            01-analytical-part.md \
            02-system-requirements.md \
            03-references.md \
            04-appendix-a-backlog.md \
            05-appendix-b-diagrams.md \
            06-statements.md \
            wireframes/index.html \
            wireframes/wireframes.css \
            wireframes/d00-introduction.html \
            wireframes/d01-analysis.html \
            wireframes/d02-requirements.html \
            wireframes/d03-references.html \
            wireframes/d04-backlog.html \
            wireframes/d05-diagrams.html \
            wireframes/d06-statements.html \
            wireframes/BA_Kalashnikov_Kirill.docx \
            wireframes/shots/key-stories.png \
            wireframes/s00-title.html \
            wireframes/s01-problem.html \
            wireframes/s02-goal.html \
            wireframes/s03-process.html \
            wireframes/s04-analogs.html \
            wireframes/s05-vision.html \
            wireframes/s06-epics.html \
            wireframes/s07-nfr.html \
            wireframes/s08-concept.html \
            wireframes/s09-backup.html \
            wireframes/s10-questions.html \
            wireframes/m1-record.html \
            wireframes/m2-preflight.html \
            wireframes/m3-error.html \
            wireframes/m4-maps.html \
            wireframes/b1-upload.html \
            wireframes/b2-jobs.html \
            wireframes/b3-report.html \
            wireframes/b4-viewer.html
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "All required package files present."

      - name: Markdown links to package files
        run: |
          set -euo pipefail
          # Internal relative links from README to sibling md / wireframes
          grep -E '\]\((01|02|03|04|05|06|BA-METHOD|wireframes/)[^)]+\)' README.md >/dev/null
          echo "README references package sections."

      - name: HTML screens are non-empty
        run: |
          set -euo pipefail
          for f in wireframes/*.html; do
            bytes=$(wc -c < "$f")
            test "$bytes" -gt 500 || { echo "too small: $f ($bytes bytes)"; exit 1; }
          done
          echo "Wireframe HTML files look populated."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli@0.43.0

      - name: Lint Markdown
        run: npx markdownlint "**/*.md" --ignore node_modules --config .markdownlint.json
