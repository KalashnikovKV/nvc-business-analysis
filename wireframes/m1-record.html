    <h1>M1 · Сканирование</h1>
    <p>Как в приложении: заголовок, статус AR, шаги 1–4, кнопка «Запись» и вкладки внизу. Слева камера ещё не готова, справа идёт обход зоны.</p>
    <nav>
      <a class="active" href="m1-record.html">M1 Сканирование</a>
      <a href="m2-preflight.html">M2 Результат</a>
      <a href="m3-error.html">M3 Переснять</a>
      <a href="m4-maps.html">M4 Мои карты</a>
    </nav>
    <p class="meta">Приложение съёмки</p>
  </aside>
  <main class="stage themes">
    <section class="theme-block">
      <h2 class="theme-label">Камера запускается</h2>
      <div class="pair">
        <figure class="shot"><figcaption>Тёмная</figcaption>
<div class="phone" aria-label="AR ещё не готов">
      <div class="phone-screen">
        <div class="notch" aria-hidden="true"></div>
        <div class="ar-bg scan">
          <div class="scan-head">
            <h2>Сканирование</h2>
            <span class="ar-pill"><i></i> AR недоступен</span>
          </div>
          <div class="stepper" aria-label="Шаги съёмки">
            <div class="step on"><b>1</b><span>Зона</span></div>
            <div class="step"><b>2</b><span>Запись</span></div>
            <div class="step"><b>3</b><span>Обход</span></div>
            <div class="step"><b>4</b><span>Проверка</span></div>
          </div>
          <p class="scan-hint">Подождите — AR-камера запускается…</p>
          <div class="scan-stage"></div>
          <div class="scan-controls">
            <button class="record-btn" type="button" disabled>Запись</button>
          </div>
          <nav class="tabbar">
            <a class="on" href="m1-record.html">Сканировать</a>
            <a href="m4-maps.html">Мои карты</a>
          </nav>
        </div>
      </div>
    </div>
</figure>
        <figure class="shot"><figcaption>Светлая</figcaption>
<div class="phone light" aria-label="AR ещё не готов">

        <div class="notch" aria-hidden="true"></div>
        <div class="ar-bg scan">

            <div class="step"><b>3</b><span>Обход</span></div>
            <div class="step"><b>4</b><span>Проверка</span></div>
          </div>

          <div class="scan-stage"></div>
          <div class="scan-controls">
            <button class="record-btn" type="button" disabled>Запись</button>

          <nav class="tabbar">
            <a class="on" href="m1-record.html">Сканировать</a>
            <a href="m4-maps.html">Мои карты</a>
          </nav>
        </div>
      </div>
    </div>
</figure>
      </div>
    </section>
    <section class="theme-block">
      <h2 class="theme-label">Обход зоны</h2>
      <div class="pair">
        <figure class="shot"><figcaption>Тёмная</figcaption>
<div class="phone" aria-label="Обход зоны">
      <div class="phone-screen">
        <div class="notch" aria-hidden="true"></div>
        <div class="ar-bg scan">
          <div class="scan-head">
            <h2>Сканирование</h2>
            <span class="ar-pill ok"><i></i> AR готов</span>
          </div>
          <div class="stepper" aria-label="Шаги съёмки">
            <div class="step done"><b>✓</b><span>Зона</span></div>
            <div class="step done"><b>✓</b><span>Запись</span></div>
            <div class="step on"><b>3</b><span>Обход</span></div>
            <div class="step"><b>4</b><span>Проверка</span></div>
          </div>
          <p class="scan-hint">Медленно обойдите зону по кругу, покажите все углы.</p>
          <div class="scan-stage">
            <div class="zone-rails locked">
              <div class="zone-label">зафиксировано</div>
            </div>
          </div>
          <div class="scan-controls">
            <div class="timer-pill">18 сек</div>
            <button class="record-btn active" type="button">Стоп</button>
          </div>
          <nav class="tabbar">
            <a class="on" href="m1-record.html">Сканировать</a>
            <a href="m4-maps.html">Мои карты</a>
          </nav>
        </div>
      </div>
    </div>
